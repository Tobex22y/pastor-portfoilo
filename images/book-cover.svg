<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bookBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#142642"/>
      <stop offset="50%" stop-color="#0c182b"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="25%" stop-color="#e5b842"/>
      <stop offset="50%" stop-color="#b88318"/>
      <stop offset="75%" stop-color="#ffd868"/>
      <stop offset="100%" stop-color="#8a5e0b"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf0be"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a47214"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffd868" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#c8902a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Spine and Page Shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="goldGlowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffd868" flood-opacity="0.45"/>
    </filter>
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Book Cover Base Canvas -->
  <rect width="800" height="1200" fill="url(#bookBg)"/>

  <!-- Subtle Texture Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <pattern id="linen" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="20"/>
      <line x1="20" y1="0" x2="0" y2="20"/>
    </pattern>
    <rect width="800" height="1200" fill="url(#linen)"/>
  </g>

  <!-- Ambient Light Center -->
  <circle cx="400" cy="500" r="380" fill="url(#sunGlow)"/>

  <!-- Outer Embossed Border -->
  <rect x="45" y="45" width="710" height="1110" rx="8" fill="none" stroke="url(#goldSheen)" stroke-width="3" filter="url(#goldGlowFilter)"/>
  <rect x="58" y="58" width="684" height="1084" rx="4" fill="none" stroke="url(#goldAccent)" stroke-width="1" opacity="0.7"/>
  <rect x="66" y="66" width="668" height="1068" rx="2" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Corner Ornamental Flourishes -->
  <!-- Top-Left -->
  <g transform="translate(65, 65)">
    <path d="M 0,40 L 0,0 L 40,0" fill="none" stroke="url(#goldSheen)" stroke-width="3"/>
    <circle cx="8" cy="8" r="4" fill="url(#goldSheen)"/>
    <path d="M 12,0 C 25,12 25,25 0,12" fill="none" stroke="url(#goldSheen)" stroke-width="1.5"/>
  </g>
  <!-- Top-Right -->
  <g transform="translate(735, 65)">
    <path d="M 0,40 L 0,0 L -40,0" fill="none" stroke="url(#goldSheen)" stroke-width="3"/>
    <circle cx="-8" cy="8" r="4" fill="url(#goldSheen)"/>
    <path d="M -12,0 C -25,12 -25,25 0,12" fill="none" stroke="url(#goldSheen)" stroke-width="1.5"/>
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(65, 1135)">
    <path d="M 0,-40 L 0,0 L 40,0" fill="none" stroke="url(#goldSheen)" stroke-width="3"/>
    <circle cx="8" cy="-8" r="4" fill="url(#goldSheen)"/>
    <path d="M 12,0 C 25,-12 25,-25 0,-12" fill="none" stroke="url(#goldSheen)" stroke-width="1.5"/>
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(735, 1135)">
    <path d="M 0,-40 L 0,0 L -40,0" fill="none" stroke="url(#goldSheen)" stroke-width="3"/>
    <circle cx="-8" cy="-8" r="4" fill="url(#goldSheen)"/>
    <path d="M -12,0 C -25,-12 -25,-25 0,-12" fill="none" stroke="url(#goldSheen)" stroke-width="1.5"/>
  </g>

  <!-- Top Category / Tagline Banner -->
  <g transform="translate(400, 150)">
    <line x1="-180" y1="0" x2="-60" y2="0" stroke="url(#goldSheen)" stroke-width="1.5"/>
    <circle cx="-50" cy="0" r="3" fill="url(#goldSheen)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="url(#goldSheen)" letter-spacing="4">DIVINE WISDOM &amp; KINGDOM PURPOSE</text>
    <circle cx="50" cy="0" r="3" fill="url(#goldSheen)"/>
    <line x1="60" y1="0" x2="180" y2="0" stroke="url(#goldSheen)" stroke-width="1.5"/>
  </g>

  <!-- Central Emblem: Crown, Cross, Radiant Rays, Open Book -->
  <g transform="translate(400, 310)" filter="url(#goldGlowFilter)">
    <!-- Sunburst Rays -->
    <g stroke="url(#goldAccent)" stroke-width="1.2" opacity="0.6">
      <line x1="0" y1="-80" x2="0" y2="-105"/>
      <line x1="56" y1="-56" x2="74" y2="-74"/>
      <line x1="80" y1="0" x2="105" y2="0"/>
      <line x1="56" y1="56" x2="74" y2="74"/>
      <line x1="0" y1="80" x2="0" y2="105"/>
      <line x1="-56" y1="56" x2="-74" y2="74"/>
      <line x1="-80" y1="0" x2="-105" y2="0"/>
      <line x1="-56" y1="-56" x2="-74" y2="-74"/>
    </g>

    <!-- Concentric Rings -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#goldSheen)" stroke-width="2"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldAccent)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Royal Crown & Open Book -->
    <!-- Crown -->
    <path d="M -26,-15 L -32,-35 L -14,-22 L 0,-42 L 14,-22 L 32,-35 L 26,-15 Z" fill="url(#goldSheen)"/>
    <circle cx="-32" cy="-37" r="3" fill="#fff5d1"/>
    <circle cx="0" cy="-44" r="3.5" fill="#fff5d1"/>
    <circle cx="32" cy="-37" r="3" fill="#fff5d1"/>
    <rect x="-26" y="-13" width="52" height="6" rx="2" fill="url(#goldAccent)"/>

    <!-- Open Book Pages -->
    <path d="M 0,22 C 16,10 38,12 44,20 L 44,40 C 38,32 16,30 0,38 C -16,30 -38,32 -44,40 L -44,20 C -38,12 -16,10 0,22 Z" fill="url(#goldSheen)"/>
    <line x1="0" y1="22" x2="0" y2="38" stroke="#122238" stroke-width="2"/>
  </g>

  <!-- Main Title: MORE THAN GOLD -->
  <g transform="translate(400, 520)" filter="url(#goldGlowFilter)">
    <!-- MORE -->
    <text x="0" y="0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="82" font-weight="700" fill="url(#goldSheen)" letter-spacing="10">MORE</text>
    <!-- THAN -->
    <text x="0" y="80" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="48" font-style="italic" font-weight="400" fill="url(#goldAccent)" letter-spacing="14">than</text>
    <!-- GOLD -->
    <text x="0" y="180" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="94" font-weight="700" fill="url(#goldSheen)" letter-spacing="14">GOLD</text>
  </g>

  <!-- Elegant Golden Divider -->
  <g transform="translate(400, 755)">
    <line x1="-160" y1="0" x2="-25" y2="0" stroke="url(#goldSheen)" stroke-width="2"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldSheen)"/>
    <line x1="25" y1="0" x2="160" y2="0" stroke="url(#goldSheen)" stroke-width="2"/>
  </g>

  <!-- Subtitle -->
  <g transform="translate(400, 810)">
    <text x="0" y="0" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="1.5">Unveiling Divine Purpose, Enduring Wisdom,</text>
    <text x="0" y="32" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="1.5">and True Riches for Life &amp; Ministry</text>
  </g>

  <!-- Author Name Banner -->
  <g transform="translate(400, 1010)" filter="url(#goldGlowFilter)">
    <rect x="-260" y="-36" width="520" height="72" rx="36" fill="#081322" stroke="url(#goldSheen)" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="4">WRITTEN BY</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="22" font-weight="700" fill="url(#goldSheen)" letter-spacing="2">BELOVED AKINKUNMI ABIMBOLA</text>
  </g>

  <!-- Spine Shadow Left Overlay -->
  <rect x="0" y="0" width="45" height="1200" fill="url(#spineShadow)"/>
  <line x1="45" y1="0" x2="45" y2="1200" stroke="#000000" stroke-width="2" opacity="0.6"/>
  <line x1="47" y1="0" x2="47" y2="1200" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
</svg>
